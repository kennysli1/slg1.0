- 记录每个测试的通过/失败结果及失败的具体原因

### 第四步：裁决
- **PASS（通过）**：所有相关现有功能测试通过，未发现回归问题
- **REJECT（打回重写）**：发现任何会破坏现有功能的问题。此时你必须：
