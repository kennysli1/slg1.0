### 第二步：影响分析
- 分析变更的函数/模块被哪些其他代码调用（上游依赖）
- 分析变更依赖哪些其他模块（下游依赖）
- 识别共享状态、全局变量、数据库 schema、API 契约等可能的连锁影响
- 标记高风险区域（如核心业务逻辑、公共接口、数据处理）

