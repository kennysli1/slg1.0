name: CI

# G4 兜底闸门：本地钩子可以被 --no-verify 绕过，这里绕不过去。
# 规矩见 docs/00_变更契约.md

on:
  push:
    branches: [main, master]
  pull_request:
  # 允许在 GitHub runner 短暂启动失败时从 Actions 页面手动重跑同一套闸门。
  workflow_dispatch:

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # 不取消正在排队/运行的必需检查，避免 PR 快速更新时留下无 job 的检查记录。
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # guard 要和 HEAD 比对 CHANGELOG / 版本号

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 配置同步后的 main 含管理员确认的 CSV 调参；仅运维/文档改动
      # 不应被默认值行为断言阻断，但触及业务代码或 CSV 仍执行完整回归。
      - name: 判断运行时变更范围
        id: change_scope
        shell: bash
        run: |
          base_ref="${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD~1' }}"
          if git diff --name-only "$base_ref...HEAD" | grep -qE '^(packages/|config/)'; then
            echo "runtime=true" >> "$GITHUB_OUTPUT"
          else
            echo "runtime=false" >> "$GITHUB_OUTPUT"
          fi

      # 运行时 PR 只有一个全量事实入口：guard、业务回归、Linux 发布布局、
      # 生产产物冒烟和依赖审计均由 verify:ci 统一编排，避免步骤间重复。
      - name: 全量校验（lint / typecheck / 测试 / 架构守卫）
        if: github.head_ref != 'config-sync/live' && steps.change_scope.outputs.runtime == 'true'
        env:
          GUARD_SKIP: ''
          GUARD_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD~1' }}
        run: npm run verify:ci

      # 配置中心提交的是可调 CSV 默认值；默认值行为断言不应阻断合法调参。
      # 非运行时改动仍验证契约、构建、配置全图、Linux 发布布局、产物冒烟和 audit。
      - name: 配置/文档校验（契约 / 构建 / 配置 / 发布）
        if: github.head_ref == 'config-sync/live' || steps.change_scope.outputs.runtime != 'true'
        env:
          GUARD_SKIP: ''
          GUARD_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD~1' }}
        run: npm run guard && npm run build:shared && npm run lint:all && npm run typecheck && npm run verify:config-sync && npm run test:ops && npm run verify:deploy && npm audit --omit=dev --audit-level=high
