name: CI

# G4 兜底闸门：本地钩子可以被 --no-verify 绕过，这里绕不过去。
# 规矩见 docs/00_变更契约.md

on:
  push:
    branches: [main, master]
  pull_request:
  # 允许在 GitHub runner 短暂启动失败时从 Actions 页面手动重跑同一套闸门。
  workflow_dispatch:

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # 不取消正在排队/运行的必需检查，避免 PR 快速更新时留下无 job 的检查记录。
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # guard 要和 HEAD 比对 CHANGELOG / 版本号

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 变更契约 R1–R6。CI 里不认逃生阀，且按提交范围比对，绕不过 --no-verify。
      - name: 变更契约（guard）
        env:
          GUARD_SKIP: ''
          GUARD_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD~1' }}
        run: npm run guard

      # 配置中心提交的是可调 CSV 默认值；普通回归测试中针对默认数值的
      # 断言不应把合法的配置中心调参判成代码失败。配置 PR 仍执行构建、
      # lint/typecheck、完整配置交叉校验和运维布局测试；代码 PR 继续执行
      # 原有全量测试。
      - name: 全量校验（lint / typecheck / 测试 / 架构守卫）
        if: github.head_ref != 'config-sync/live'
        run: npm run verify:quick

      - name: 配置同步校验（构建 / lint / 类型 / 配置全图 / 运维布局）
        if: github.head_ref == 'config-sync/live'
        run: npm run build:shared && npm run lint:all && npm run typecheck && npm run verify:config-sync && npm run test:ops

      - name: 生产产物端到端冒烟（HTTP / 静态前端 / WebSocket）
        run: npm run verify:deploy

      - name: 依赖审计
        run: npm audit --omit=dev --audit-level=high
