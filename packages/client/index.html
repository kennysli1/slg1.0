<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover：内容延伸到刘海屏安全区，配合 CSS env(safe-area-inset-*) -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#5a4632" />
    <!-- iOS 全屏 Web App（添加到主屏幕后隐藏 Safari 地址栏） -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="世界之王" />
    <link rel="apple-touch-icon" href="/art/ui_logo.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>世界之王</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
